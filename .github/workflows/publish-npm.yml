name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'mcp-server/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        working-directory: mcp-server
        run: npm install
      
      - name: Build
        working-directory: mcp-server
        run: npm run build
      
      - name: Run tests
        working-directory: mcp-server
        run: npm test
      
      - name: Publish to NPM
        working-directory: mcp-server
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Published to NPM as opengraph-mcp
            
            [View on NPM](https://www.npmjs.com/package/opengraph-mcp)
          draft: false
          prerelease: false
