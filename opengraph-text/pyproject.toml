[project]
name = "opengraph-text"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.111.0",
    "mcp>=1.28.0",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "tqdm>=4.68.3",
    "typer>=0.26.7",
]

[project.scripts]
opengraph-text = "opengraph_text.cli:app"
opengraph-text-mcp = "opengraph_text.server:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]
