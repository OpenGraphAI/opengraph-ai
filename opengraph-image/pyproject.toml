[project]
name = "opengraph-image"
version = "0.1.0"
description = "Image-only knowledge-graph MCP server (v0)"
readme = "README.md"
authors = [
    { name = "Andrea Liao", email = "andrea.liyu.liao@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.111.0",
    "mcp>=1.28.0",
    "networkx>=3.6.1",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "tqdm>=4.68.3",
    "typer>=0.26.7",
]

[project.scripts]
opengraph-image = "opengraph_image:main"
opengraph-image-mcp = "opengraph_image:mcp_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]
