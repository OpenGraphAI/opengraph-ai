[project]
name = "opengraph-table"
version = "0.1.0"
description = "Table-based knowledge-graph extraction and querying (v0)"
readme = "README.md"
authors = [
    { name = "OpenGraph Team", email = "team@opengraph.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.111.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "mcp>=1.28.0",
    "networkx>=3.6.1",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "tqdm>=4.68.3",
    "typer>=0.26.7",
]

[project.scripts]
opengraph-table = "opengraph_table:main"
opengraph-table-mcp = "opengraph_table:mcp_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]
